[package]
name = "localify"
version = "0.1.0"
description = "Localify - A hi-fi local music player"
authors = ["Localify"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "localify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["full"] }

rusqlite = { version = "0.31", features = ["bundled"] }
rusqlite_migration = "1.2"

lofty = "0.21"
symphonia = { version = "0.5", features = ["all"] }

walkdir = "2"
rayon = "1"
crossbeam-channel = "0.5"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
thiserror = "1"
anyhow = "1"
async-trait = "0.1"

# Last.fm scrobbling
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
md-5 = "0.10"

# Audio output device enumeration (already transitive via rodio, but make it explicit)
cpal = "0.15"
tokio-util = { version = "0.7", features = ["io"] }

# Google Cast (Chromecast) support
rust_cast = "0.12"
mdns-sd = "0.11"
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "http2"] }
local-ip-address = "0.6"

[dev-dependencies]
tempfile = "3"
